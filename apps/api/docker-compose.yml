# Postgres local para desarrollo: `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dndficha
      POSTGRES_PASSWORD: dndficha
      POSTGRES_DB: dndficha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
